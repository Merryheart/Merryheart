<svg xmlns="http://w3.org" viewBox="0 0 400 50" width="400" height="50">
  <style>
    @media (prefers-color-scheme: dark) {
      .text { fill: #c9d1d9 !important; }
    }
    .text {
      font-family: 'Courier New', monospace;
      font-weight: bold;
      font-size: 24px;
      fill: #24292f;
      stroke: none;
    }
    .cursor {
      fill: #58a6ff;
      animation: blink 0.75s step-end infinite;
    }
    @keyframes blink {
      50% { opacity: 0; }
    }
  </style>

  <text x="10" y="32" class="text">Hi, I'm Merryheart</text>
  <rect x="275" y="12" width="3" height="24" class="cursor" />
</svg>
